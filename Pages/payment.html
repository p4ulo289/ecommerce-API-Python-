<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - DevMarket</title>
    <link rel="stylesheet" href="../Style.css">
</head>
<body>

<header>
    <a href="../index.html">
        <h1 class="title">DevMarket</h1>
    </a>
    <a href="./cart.html" class="back-link">&larr; Voltar ao carrinho</a>
</header>

<h1>Pagamento</h1>

<div id="payment-page">

    <section id="order-summary-section">
        <h2>Resumo do pedido</h2>
        <div id="order-summary"></div>
        <h3 id="payment-total"></h3>
    </section>

    <section id="payment-methods-section">
        <h2>Forma de pagamento</h2>

        <div class="payment-methods">
            <button type="button" id="method-debito" class="payment-method-btn" onclick="selectMethod('debito')">Débito</button>
            <button type="button" id="method-credito" class="payment-method-btn" onclick="selectMethod('credito')">Crédito</button>
            <button type="button" id="method-boleto" class="payment-method-btn" onclick="selectMethod('boleto')">Boleto</button>
            <button type="button" id="method-pix" class="payment-method-btn" onclick="selectMethod('pix')">Pix</button>
        </div>

        <div id="payment-form-area"></div>

        <button id="confirm-payment" class="btn-confirm" disabled>Confirmar Pagamento</button>
    </section>

</div>

<script type="module" src="./payment.js"></script>
</body>
</html>
